<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر زبون — كل ما تتمناه بمكان واحد</title>
<meta name="description" content="متجر زبون الإلكتروني — تسوق من متاجر الكوت: ملابس، مكياج، ألعاب، إلكترونيات وأكثر، مع توصيل سريع.">
<link rel="stylesheet" href="/store/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2311356b'/><text x='50' y='70' font-size='60' font-family='sans-serif' fill='white' text-anchor='middle'>ز</text></svg>">
</head>
<body>

<!-- ═══════ الترويسة — صفّان ═══════ -->
<header class="top">
  <div class="row1">
    <a class="brand" href="#/" onclick="APP.home();">
      <span class="brand-ic">🛍️</span>
      <span class="brand-tt">زبون</span>
    </a>
    <div class="search">
      <input id="q" type="search" placeholder="ابحث عن منتج أو محل…" onkeydown="if(event.key==='Enter')APP.search(this.value)">
      <button onclick="APP.search(document.getElementById('q').value)">🔍</button>
    </div>
    <div class="acts">
      <button class="loved" id="favBtn" title="المفضلة" onclick="APP.view('fav')">❤️<span id="favBadge" class="badge hide">0</span></button>
      <button class="cartb" title="السلة" onclick="APP.cartToggle()">🛒<span id="cartBadge" class="badge hide">0</span></button>
      <button class="userb" id="userBtn" onclick="UI.userMenu()">👤<span id="userName"></span></button>
    </div>
  </div>
  <div class="row2">
    <div class="row2-in" id="row2Links">
      <a href="#/" class="on" onclick="APP.home();return false;">الرئيسية</a>
      <a href="#stores" onclick="APP.view('stores');return false;">المتاجر</a>
      <a href="#prods" onclick="APP.view('prods');return false;">كل المنتجات</a>
      <a href="#offers" onclick="APP.catProds(-1);return false;">🔥 العروض</a>
      <a href="/" onclick="return true;">الصفحة الرسمية</a>
    </div>
  </div>
  <div class="user-pop hide" id="userPop">
    <a href="#orders" onclick="APP.view('orders');UI.closeUser()">📦 طلباتي</a>
    <a href="#fav" onclick="APP.view('fav');UI.closeUser()">❤️ المفضلة</a>
    <a href="#profile" onclick="APP.view('profile');UI.closeUser()">👤 حسابي</a>
    <a href="#logout" onclick="APP.logout()">🚪 خروج</a>
  </div>
</header>

<!-- ═══════ شاشات ═══════ -->
<main id="screen"></main>

<!-- ═══════ السلة (درج) ═══════ -->
<div class="overlay hide" id="cartOverlay" onclick="APP.cartClose()"></div>
<aside class="cart" id="cart" dir="rtl">
  <div class="cart-head"><b>سلة التسوق 🛒</b><button onclick="APP.cartClose()">✕</button></div>
  <div id="cartBody" class="cart-body"></div>
  <div class="cart-foot" id="cartFoot"></div>
</aside>

<!-- ═══════ نافذة المنتج ═══════ -->
<div class="overlay hide" id="pOverlay" onclick="APP.closeProduct()"></div>
<div class="pmodal hide" id="pModal" dir="rtl"></div>

<!-- ═══════ الدخول ═══════ -->
<div class="lmask hide" id="lmask" onclick="UI.closeLogin()"></div>
<div class="login hide" id="login" dir="rtl"></div>

<!-- ═══════ الشريط السفلي — مثل التطبيق ═══════ -->
<nav class="bnav">
  <div class="in">
    <button id="n-home" data-v="home" onclick="APP.home()"><span class="ic">🏠</span>الرئيسية</button>
    <button id="n-stores" data-v="stores" onclick="APP.view('stores')"><span class="ic">🏬</span>المتاجر</button>
    <button id="n-cart" data-v="cart" onclick="APP.cartToggle()"><span class="ic">🛒</span>السلة<span id="cbadge" class="cbadge hide">0</span></button>
    <button id="n-fav" data-v="fav" onclick="APP.view('fav')"><span class="ic">❤️</span>المفضلة</button>
    <button id="n-profile" data-v="profile" onclick="APP.view('profile')"><span class="ic">👤</span>حسابي</button>
  </div>
</nav>

<!-- ═══════ التحميل والإشعارات ═══════ -->
<div class="load hide" id="load"><div class="spin"></div></div>
<div class="toast hide" id="toast"></div>

<footer class="foot">
  <div><b>زبون</b> — منصة متاجر محافظة واسط (الكوت)</div>
  <div class="foot-links">
    <a href="/" onclick="return true;">الصفحة الرسمية</a> ·
    <a href="https://t.me/soog_otp_bot">بوت الإشعارات</a> ·
    <a href="/admin" onclick="return true;">لوحة الأدمن</a>
  </div>
</footer>

<script src="/store/app.js"></script>
</body>
</html>
